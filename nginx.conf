# Nginx 配置示例 - VitePress 静态站点
# 把此文件放到服务器的 /etc/nginx/sites-available/ 或 /etc/nginx/conf.d/ 中
# 然后 ln -s 到 sites-enabled/ 并 reload nginx

server {
    listen 80;
    # 如果有域名，把下面改成你的域名
    # 如果没有域名，改成你的服务器公网 IP
    server_name _;

    # 构建后的静态文件目录
    root /var/www/blog/dist;
    index index.html;

    # Gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # VitePress cleanUrls 需要这个配置
    # 把 /blog/langgraph-analysis 映射到 /blog/langgraph-analysis.html
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # 404 页面
    error_page 404 /404.html;

    # 缓存静态资源
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}

